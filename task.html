  <title>Earn Rewards - TrustReward</title>  <style>

    * {

  </style></head><body>  <div class="container"><div class="header">

  <h1>💰 Earn Rewards</h1>

  <p>
    Complete available offers and earn coins.
    Offers are automatically matched to your device and location.
  </p>

  <div
    id="status"
    class="status"
  >
    Loading available offers...
  </div>

</div>


<div
  id="offers"
  class="offers"
>

  <div class="loading">
    🔄 Finding available offers...
  </div>

</div>


<div
  id="userid"
  class="userid"
></div>

  </div>  <script>

    // =================================================
    // USER ID
    // =================================================

    let userId =
      localStorage.getItem(
        "trustreward_userid"
      );


    if (!userId) {

      userId =
        "user_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 8);

      localStorage.setItem(
        "trustreward_userid",
        userId
      );

    }


    document.getElementById(
      "userid"
    ).textContent =
      "User ID: " + userId;


    // =================================================
    // ELEMENTS
    // =================================================

    const offersContainer =
      document.getElementById(
        "offers"
      );


    const statusElement =
      document.getElementById(
        "status"
      );


    // =================================================
    // LOAD OGADS OFFERS
    // =================================================

    async function loadOGAdsOffers() {

      try {

        statusElement.textContent =
          "Loading available offers...";


        const response =
          await fetch(
            "/offers/ogads",
            {
              method: "GET",
              cache: "no-store"
            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Unable to load offers."
          );

        }


        const data =
          result.offers;


        // =================================================
        // HANDLE DIFFERENT OGADS RESPONSE FORMATS
        // =================================================

        let offers = [];


        if (Array.isArray(data)) {

          offers = data;

        }

        else if (
          data &&
          Array.isArray(data.offers)
        ) {

          offers =
            data.offers;

        }

        else if (
          data &&
          Array.isArray(data.data)
        ) {

          offers =
            data.data;

        }


        // =================================================
        // NO OFFERS
        // =================================================

        if (
          offers.length === 0
        ) {

          offersContainer.innerHTML = `

            <div class="empty">

              <h3>
                😔 No offers available
              </h3>

              <p>
                There are currently no offers
                available for your device or location.
                Please check again later.
              </p>

            </div>

          `;

          statusElement.textContent =
            "No offers available";

          return;

        }


        // =================================================
        // DISPLAY OFFERS
        // =================================================

        offersContainer.innerHTML = "";


        offers.forEach(
          (offer, index) => {

            const name =
              offer.name ||
              offer.title ||
              offer.offer_name ||
              "Available Offer";


            const description =
              offer.description ||
              offer.desc ||
              offer.instructions ||
              "Complete this offer to earn rewards.";


            const url =
              offer.url ||
              offer.link ||
              offer.offer_url ||
              offer.click_url ||
              "#";


            const payout =
              Number(
                offer.payout ||
                offer.amount ||
                offer.reward ||
                0
              );


            const coins =
              Math.floor(
                payout * 250
              );


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "offer";


            card.innerHTML = `

              <div class="offer-top">

                <div class="offer-name">
                  ${escapeHtml(name)}
                </div>

                <div class="reward">
                  +${coins.toLocaleString()} coins
                </div>

              </div>


              <div class="description">
                ${escapeHtml(description)}
              </div>


              <a
                class="offer-button"
                href="${escapeAttribute(url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Start Offer →
              </a>

            `;


            offersContainer.appendChild(
              card
            );

          }
        );


        statusElement.textContent =
          `${offers.length} offer${offers.length === 1 ? "" : "s"} available`;


      } catch (error) {

        console.error(
          "OGAds frontend error:",
          error
        );


        offersContainer.innerHTML = `

          <div class="empty">

            <h3>
              ⚠️ Unable to load offers
            </h3>

            <p>
              Please refresh the page and try again.
            </p>

          </div>

        `;


        statusElement.textContent =
          "Unable to load offers";

      }

    }


    // =================================================
    // HTML ESCAPING
    // =================================================

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(value) {

      return String(value)
        .replace(
          /"/g,
          "%22"
        )
        .replace(
          /'/g,
          "%27"
        );

    }


    // =================================================
    // START
    // =================================================

    loadOGAdsOffers();

  </script></body>
